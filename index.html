<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manu Gowda — SDE</title>
<style>
  :root {
    --bg: #0d1b2a;
    --card: #152838;
    --accent: #3ddc97;
    --text: #e6edf3;
    --muted: #9fb3c8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; line-height: 1.6;
  }
  .card {
    background: var(--card); max-width: 620px; width: 100%;
    border-radius: 16px; padding: 40px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .avatar {
    width: 120px; height: 120px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #2a9d8f);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 700; color: var(--bg);
    margin: 0 auto 20px;
  }
  h1 { font-size: 30px; margin-bottom: 4px; }
  .tag { color: var(--accent); font-weight: 600; margin-bottom: 16px; }
  p.bio { color: var(--muted); margin-bottom: 28px; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .links a {
    text-decoration: none; color: var(--text);
    border: 1px solid var(--muted); padding: 10px 18px; border-radius: 8px;
    font-size: 14px; transition: .15s;
  }
  .links a:hover { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .stack { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
  .stack span {
    font-size: 12px; color: var(--accent);
    background: rgba(61,220,151,.1); border: 1px solid rgba(61,220,151,.25);
    padding: 4px 10px; border-radius: 20px;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">MG</div>
    <h1>Manu Gowda</h1>
    <div class="tag">Software Development Engineer</div>
    <p class="bio">Backend engineer in Bangalore. I build scalable REST APIs and microservices with Java, Python, and React.js.</p>
    <div class="stack">
      <span>Java</span><span>Python</span><span>Microservices</span><span>REST APIs</span><span>React.js</span><span>MySQL</span>
    </div>
    <nav class="links">
      <a href="https://github.com/manugowda19">GitHub</a>
      <a href="https://linkedin.com/in/manu-gowda-19-mg">LinkedIn</a>
      <a href="https://leetcode.com/u/manugowda19">LeetCode</a>
      <a href="mailto:manugowda9591710399@gmail.com">Email</a>
    </nav>
  </main>
</body>
</html>
